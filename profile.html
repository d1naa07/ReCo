<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReCo - User Dashboard</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins", sans-serif;
}

body{
    background:linear-gradient(135deg,#D5FFF5,#A8FFBD);
    min-height:100vh;
}

header{
    background:#003B30;
    padding:15px 20px;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:1.5rem;
    font-weight:600;
}

/* PROFILE HEADER (SEPARATE CARD BELOW) */
.profile-header{
    display:flex;
    align-items:center;
    gap:15px;
    padding:20px;
}

.avatar-wrapper{
    position:relative;
    width:70px;
    height:70px;
}

.profile-pic{
    width:70px;
    height:70px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #003B30;
    cursor:pointer;
}

.avatar-wrapper input{
    display:none;
}

.avatar-wrapper::after{
    content:"+";
    position:absolute;
    bottom:0;
    right:0;
    background:#003B30;
    color:white;
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    opacity:0;
    transition:0.2s;
}

.avatar-wrapper:hover::after{
    opacity:1;
}

.username{
    font-size:1.3rem;
    font-weight:600;
    color:#003B30;
}

.container{
    padding:20px;
}

.dashboard-box{
    display:flex;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    overflow:hidden;
    min-height:70vh;
}

.sidebar{
    width:220px;
    background:#f4fff7;
    padding:15px;
}

.tab{
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    border-radius:10px;
    background:#e9f7ee;
    transition:0.2s;
}

.tab:hover{ background:#A8FFBD; }
.tab.active{ background:#003B30; color:white; }

.content{
    flex:1;
    padding:20px;
}

.section{ display:none; }
.section.active{ display:block; }

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    padding:10px;
    border:none;
    border-radius:20px;
    background:#003B30;
    color:white;
    cursor:pointer;
}

.recycle-item{
    padding:10px;
    background:#f5fff7;
    margin-bottom:10px;
    border-radius:10px;
}

</style>
</head>
<body>

<header>
    <a href="index.html" class="logo">🍀 ReCo Dashboard</a>
</header>

<!-- SEPARATE PROFILE AREA -->
<div class="profile-header">

    <label class="avatar-wrapper">
        <img class="profile-pic" id="preview" src="https://via.placeholder.com/70">
        <input type="file" accept="image/*" onchange="loadImage(event)">
    </label>

    <div class="username">Your Name</div>

</div>

<div class="container">

    <div class="dashboard-box">

        <div class="sidebar">
            <div class="tab active" onclick="showTab('profile')">Personal Information</div>
            <div class="tab" onclick="showTab('recycles')">My Recycles</div>
            <div class="tab" onclick="showTab('settings')">Settings</div>
        </div>

        <div class="content">

            <div id="profile" class="section active">
                <h2>Personal Info</h2>

                <input type="text" placeholder="Full Name">
                <input type="email" placeholder="Email">
                <input type="text" placeholder="Phone Number">
                <input type="text" placeholder="Address">

                <button>Save Info</button>
            </div>

            <div id="recycles" class="section">
                <h2>Previous Recycles</h2>

                <div class="recycle-item">Wood - 5kg - $10 - Completed</div>
                <div class="recycle-item">Metal - 2kg - $10 - Pending</div>

            </div>

            <div id="settings" class="section">
                <h2>Settings</h2>
                <button>Logout</button>
            </div>

        </div>

    </div>

</div>

<script>
function showTab(tab){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
}

function loadImage(event){
    const image = document.getElementById('preview');
    image.src = URL.createObjectURL(event.target.files[0]);
}
</script>

</body>
</html>
